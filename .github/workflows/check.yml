name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: make check
      - run: modebench evaluate examples/responses.jsonl --output outputs/example.json
      - run: python ops/verify_release.py
