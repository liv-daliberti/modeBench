name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ops/check_docs.py'
      - 'ops/summarize*.py'
      - 'src/remax/walkthrough.py'
      - 'README.md'
      - 'CITATION.cff'
      - 'assets/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'ops/check_docs.py'
      - 'ops/summarize*.py'
      - 'src/remax/walkthrough.py'
      - 'README.md'
      - 'CITATION.cff'
      - 'assets/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'modebench[data]==0.4.0'
      - run: python -m pip install -r docs/requirements.txt
      - name: Check guide examples and evidence tables
        run: |
          python -m sphinx -W --keep-going -b doctest docs outputs/docs-doctest
          python ops/summarize_levels.py --check
      - name: Build searchable documentation
        run: |
          python -m sphinx -n -W --keep-going -b html docs outputs/docs
          python ops/check_docs.py outputs/docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: outputs/docs
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
