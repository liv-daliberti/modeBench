[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modebench"
version = "0.1.0"
description = "Execution-bound correctness and solution mode diversity benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
data = ["datasets>=2.16.1", "huggingface-hub"]
dev = ["pytest", "datasets>=2.16.1", "huggingface-hub"]

[project.urls]
Repository = "https://github.com/liv-daliberti/modeBench"
Documentation = "https://github.com/liv-daliberti/modeBench/tree/main/docs"
Issues = "https://github.com/liv-daliberti/modeBench/issues"

[project.scripts]
modebench = "modebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "ops", "."]
