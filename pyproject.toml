[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modebench"
version = "0.3.0"
description = "Execution-bound correctness and solution mode diversity benchmark"
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["sympy>=1.12,<2"]

[project.optional-dependencies]
data = ["datasets>=2.16.1,<6", "huggingface-hub>=0.19.4,<2"]
dev = ["pytest", "datasets>=2.16.1,<6", "huggingface-hub>=0.19.4,<2"]

[project.urls]
Repository = "https://github.com/liv-daliberti/modeBench"
Documentation = "https://github.com/liv-daliberti/modeBench#readme"
Issues = "https://github.com/liv-daliberti/modeBench/issues"

[project.scripts]
modebench = "modebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
modebench = ["*.json"]
